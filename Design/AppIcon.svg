<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b3d"/>
      <stop offset="0.55" stop-color="#1a1426"/>
      <stop offset="1" stop-color="#0e0c16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ff3b5c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3b5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ff2d6f"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a4a"/>
      <stop offset="1" stop-color="#e8174f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="textFade"><rect x="300" y="200" width="550" height="120" fill="url(#fade)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- menu bar item: tiny artwork + scrolling title -->
    <rect x="190" y="208" width="644" height="104" rx="30" fill="url(#bar)"/>
    <rect x="216" y="228" width="64" height="64" rx="14" fill="url(#art)"/>
    <g mask="url(#textFade)" fill="#ffffff">
      <rect x="306" y="240" width="250" height="18" rx="9" opacity="0.95"/>
      <rect x="576" y="240" width="180" height="18" rx="9" opacity="0.95"/>
      <rect x="306" y="270" width="160" height="14" rx="7" opacity="0.55"/>
      <rect x="486" y="270" width="230" height="14" rx="7" opacity="0.55"/>
    </g>

    <!-- seek bar -->
    <rect x="230" y="760" width="564" height="14" rx="7" fill="#ffffff" opacity="0.18"/>
    <rect x="230" y="760" width="330" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
    <circle cx="560" cy="767" r="20" fill="#ffffff"/>

    <!-- play button -->
    <circle cx="512" cy="530" r="150" fill="url(#btn)"/>
    <circle cx="512" cy="530" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
    <path d="M478 462 L478 598 L590 530 Z" fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
